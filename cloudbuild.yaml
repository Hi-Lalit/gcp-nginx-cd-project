substitutions:
  _REGION: 'us-east1'
  _REPOSITORY: 'docker-repo'
  _IMAGE: 'nginx-app'
  _LOG_BUCKET: 'devops_ci_logs'

steps:
  # Step 1: Create a release in Google Cloud Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: delivery-pipeline
    entrypoint: 'gcloud'
    args:
      - 'deploy'
      - 'releases'
      - 'create'
      - 'release-$SHORT_SHA' 
      - '--delivery-pipeline=nginx-app-cd-pipeline'
      - '--region=${_REGION}'
      - '--images=nginx-app=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA'

logsBucket: 'gs://${_LOG_BUCKET}'