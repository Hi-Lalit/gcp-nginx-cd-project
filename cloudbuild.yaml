substitutions:
  _REGION: 'us-east1'
  _REPOSITORY: 'docker-repo'
  _IMAGE: 'nginx-app'
  _LOG_BUCKET: 'devops_ci_logs'
  _TAG: 'v1.01'

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'apply-and-deploy'
    entrypoint: 'bash'
    args: 
    - '-c'
    - |
        set -e
        # 1. create delivery pipeline

        gcloud deploy apply \
        --file=clouddeploy.yaml \
        --region=${_REGION} \
        --project=$PROJECT_ID

        # 2. create the release to deploy image

        gcloud deploy releases create release-${SHORT_SHA} \
          --delivery-pipeline=nginx-app-delivery-pipeline \
          --region=${_REGION} \
          --images=nginx-app=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}

        # 3. promote the release to dev

        gcloud deploy releases promote \
          --release=release-${SHORT_SHA} \
          --delivery-pipeline=nginx-app-delivery-pipeline \
          --region=${_REGION}
          --to-target=dev \
          --quiet

        # 4. promote the release from dev to staging

        gcloud deploy releases promote \
          --release=release-${SHORT_SHA} \
          --delivery-pipeline=nginx-app-delivery-pipeline \
          --region=${_REGION}
          --to-target=staging \
          --quiet

        # 5. promote the release from staging to prod

        gcloud deploy releases promote \
          --release=release-${SHORT_SHA} \
          --delivery-pipeline=nginx-app-delivery-pipeline \
          --region=${_REGION}
          --to-target=prod \
          --quiet

logsBucket: 'gs://${_LOG_BUCKET}'